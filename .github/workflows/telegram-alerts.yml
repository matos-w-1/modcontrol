name: Telegram alerts
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the alerts endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron-alerts"
